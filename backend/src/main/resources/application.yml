spring:
  application:
    name: podcuaderno
  autoconfigure:
    # No generated in-memory user nor logged test password; real users arrive with HU-01.
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # Local development defaults; docker compose and production override them.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:podcuaderno}
    username: ${DB_USER:podcuaderno}
    password: ${DB_PASSWORD:podcuaderno}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    # Mailpit locally (docker compose); a real SMTP provider in production.
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: delete
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # Application health must not depend on the email provider.
      enabled: false
podcuaderno:
  security:
    # Base64 HMAC key of at least 32 bytes. Optional: without it a random key is generated at startup (ADR-0009).
    jwt-secret: ${JWT_SECRET:}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  identity:
    # Secure refresh cookie; false only for Safari against plain-http localhost (ADR-0009).
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  mail:
    from: ${MAIL_FROM:no-responder@podcuaderno.local}
    # Public URL of the web app, used in the links of the emails.
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
