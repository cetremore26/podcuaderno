# Project key and organization are assumed; confirm them when the SonarCloud project is created
# (with automatic analysis disabled, since CI runs the scanner).
sonar.projectKey=cetremore26_podcuaderno
sonar.organization=cetremore26
sonar.projectName=Podcuaderno
sonar.sourceEncoding=UTF-8
# Fail the CI job when the quality gate fails, so a red gate blocks the merge.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
sonar.modules=backend,frontend

backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java
backend.sonar.java.source=25
backend.sonar.java.binaries=build/classes/java/main
backend.sonar.java.test.binaries=build/classes/java/test
backend.sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

frontend.sonar.sources=src
frontend.sonar.exclusions=**/*.test.ts,**/*.test.tsx
frontend.sonar.tests=src,tests,e2e
frontend.sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/**,e2e/**
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info
