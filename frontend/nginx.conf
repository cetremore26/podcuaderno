server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Same origin for the SPA and the API: no CORS needed locally.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed file names, so assets never change.
    location /assets/ {
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
