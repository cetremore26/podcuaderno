version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      spring: { patterns: ["org.springframework*", "io.spring*", "org.springdoc*"] }
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      lint: { patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier", "globals"] }
      test: { patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom", "@playwright/test"] }
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (peer range <6.1.0).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
