name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, format check, tests (incl. architecture) and coverage gate
        run: ./gradlew build
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/build/reports/tests/test
            backend/build/reports/jacoco/test/html
            backend/build/spring-modulith-docs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config -q
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through the published ports
        run: |
          curl -fsS http://localhost:3000/ | grep -q Podcuaderno
          curl -fsS http://localhost:8080/actuator/health | grep -q UP
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Job-level "if" cannot read secrets, so each step checks the token instead.
    # Pull requests from Dependabot or forks get no secrets and skip the analysis.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not configured; skipping SonarCloud analysis."
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - if: env.SONAR_TOKEN != ''
        uses: gradle/actions/setup-gradle@v6
      - if: env.SONAR_TOKEN != ''
        name: Backend build with coverage
        working-directory: backend
        run: ./gradlew build -x spotlessCheck
      - if: env.SONAR_TOKEN != ''
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - if: env.SONAR_TOKEN != ''
        name: Frontend tests with coverage
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test:coverage
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
